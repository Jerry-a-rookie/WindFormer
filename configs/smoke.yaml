project:
  name: dlinear-smoke-test
  seed: 7

data:
  dataset_name: synthetic
  input_path: data/raw/synthetic.csv
  prepared_path: data/processed/synthetic_h6.npz
  timestamp_column: timestamp
  turbine_column: turbine_id
  speed_column: wind_speed
  direction_column: wind_direction
  x_column: x
  y_column: y
  interval_minutes: 10
  lookback: 24
  horizon: 6
  split: [0.7, 0.1, 0.2]
  max_speed: 40.0
  max_gap_steps: 3
  fft_denoise:
    enabled: false
    amplitude_quantile: 0.1
  synthetic:
    timesteps: 480
    turbines: 4

model:
  name: dlinear
  moving_average: 7
  individual: true

training:
  device: auto
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0
  epochs: 3
  patience: 2
  num_workers: 0
  speed_loss_weight: 1.0
  direction_loss_weight: 0.5

evaluation:
  paper_results_path: reports/paper_results.yaml
  prediction_plot_samples: 96
