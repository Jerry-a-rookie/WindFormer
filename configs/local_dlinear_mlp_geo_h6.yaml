project:
  name: local-dlinear-mlp-geo-h6
  seed: 2026

data:
  dataset_name: penmanshiel_2016_2022_extended
  format: penmanshiel_zip
  input_path: data/raw/penmanshiel
  static_metadata_path: data/raw/penmanshiel/Penmanshiel_WT_static.csv
  prepared_path: data/processed/penmanshiel_2016_2022_h6_full_interp_fft.npz
  direction_representation: scalar
  interval_minutes: 10
  lookback: 288
  horizon: 6
  fft_denoise:
    enabled: true
    scope: full_sequence
    apply_to: [input, target]
    apply_features: [speed]
    amplitude_quantile: 0.1

model:
  name: dlinear_mlp_geo
  moving_average: 25
  residual_hidden_size: 32
  residual_dropout: 0.05
  graph_k: 4
  graph_kernel_scale: null
  graph_strength: 0.5
  direction_convention: from
  graph_temperature: 0.35
  use_graph: true

training:
  device: auto
  amp: true
  deterministic: false
  batch_size: 128
  learning_rate: 0.0001
  weight_decay: 0.0001
  epochs: 10
  patience: 3
  num_workers: 0
  speed_loss_weight: 1.0
  direction_loss_weight: 1.0
  vector_loss_weight: 0.1
  circular_direction_loss: true
  low_wind_direction_threshold: 1.0

evaluation:
  direction_metric: circular
  report_horizons: [6]
  prediction_plot_samples: 144
