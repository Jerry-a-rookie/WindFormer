project:
  name: penmanshiel-dlinear-geo-2016-2022
  seed: 2026

data:
  dataset_name: penmanshiel_2016_2022_extended
  format: penmanshiel_zip
  input_path: data/raw/penmanshiel
  static_metadata_path: data/raw/penmanshiel/Penmanshiel_WT_static.csv
  # This file is produced by the existing preprocessing step. Model-only
  # comparisons do not require running prepare_data.py again.
  prepared_path: data/processed/penmanshiel_2016_2022_h24_full_interp_fft.npz
  years: [2016, 2017, 2018, 2019, 2020, 2021, 2022]
  timestamp_column: null
  speed_column: null
  direction_column: null
  direction_representation: scalar
  interval_minutes: 10
  lookback: 288
  horizon: 24
  split: [0.7, 0.1, 0.2]
  max_speed: 25.0
  max_gap_steps: null
  fft_denoise:
    enabled: true
    scope: full_sequence
    apply_to: [input, target]
    apply_features: [speed]
    amplitude_quantile: 0.1

model:
  name: dlinear_geo
  moving_average: 25
  ema_alpha: 0.15
  graph_k: 4
  graph_kernel_scale: null
  graph_strength: 0.5
  direction_convention: from
  graph_temperature: 0.35
  use_graph: true

training:
  device: auto
  amp: true
  deterministic: false
  batch_size: 128
  learning_rate: 0.0001
  weight_decay: 0.0001
  epochs: 10
  patience: 3
  num_workers: 0
  speed_loss_weight: 1.0
  direction_loss_weight: 1.0
  vector_loss_weight: 0.1
  circular_direction_loss: true
  low_wind_direction_threshold: 1.0

evaluation:
  direction_metric: circular
  report_horizons: [6, 12, 18, 24]
  paper_results_path: reports/paper_results.yaml
  prediction_plot_samples: 144

benchmark:
  run_prefix: penmanshiel-dlinear-geo-2016-2022
  horizons: [6, 12, 18, 24]
  models:
    dlinear:
      model:
        moving_average: 25
        individual: true
      evaluation:
        direction_metric: scalar
    dlinear_ema:
      model:
        decomposition: ema
        ema_alpha: 0.15
        use_graph: false
    dlinear_geo:
      model:
        decomposition: moving_average
        moving_average: 25
        use_graph: true
        graph_k: 4
        graph_strength: 0.5
        graph_temperature: 0.35
    dlinear_ema_geo:
      model:
        decomposition: ema
        ema_alpha: 0.15
        use_graph: true
        graph_k: 4
        graph_strength: 0.5
        graph_temperature: 0.35
